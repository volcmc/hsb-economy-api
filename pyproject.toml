[project]
name = "hsb-economy"
version = "3.0.0"
description = "Static Hypixel SkyBlock auction and bazaar data, rebuilt on a schedule and served from GitHub Pages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "nbtlib==2.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[project.scripts]
hsb-economy = "hsb_economy.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
