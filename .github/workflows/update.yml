name: Update data

on:
  schedule:
    # Offset from the top of the hour, when GitHub's scheduler is most congested and drops runs.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs must never overlap: each one reads the state the previous one saved.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # prune old state caches, keep this schedule enabled
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install .

      - id: pages
        uses: actions/configure-pages@v6

      # restore-keys picks the newest state-* entry, i.e. the previous run's state.
      - uses: actions/cache/restore@v6
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Build site
        run: python -m hsb_economy --out site --state state/state.json.gz
        env:
          HSB_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/cache/save@v6
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Prune old state caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key state- --sort created_at --order desc --limit 100 \
            --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"

      # This pipeline never commits, so GitHub would disable the schedule after 60 days without repository
      # activity. Re-enabling through the API prevents that.
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
